name: Bug report
description: 报告可复现的缺陷
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: 请先删除日志中的 Token、API 密钥、视频路径和个人信息。
  - type: input
    id: version
    attributes:
      label: 项目版本 / Web 构建号
      placeholder: v0.2.0 / 2026.08.11-r7-ccd8105
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境
      description: 操作系统、Python、GPU、显存、驱动、CUDA、安装方式
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 已脱敏日志
      render: shell
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已删除 Token、API 密钥、未授权声音/视频与个人信息
          required: true

