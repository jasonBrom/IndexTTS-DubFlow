name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.10"
          enable-cache: true
      - name: Install test environment
        run: uv sync --frozen --extra test
      - name: Compile Python sources
        run: uv run python -m compileall -q app.py original_dubber scripts tests
      - name: Lint
        run: uv run ruff check .
      - name: Unit tests
        run: uv run pytest -q
      - name: Cross-platform installer dry run
        run: uv run python scripts/setup_runtime.py --dry-run
      - name: Build and verify release artifacts
        run: |
          uv run python scripts/build_artifacts.py
          uv run python scripts/build_artifacts.py --check
