name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build deterministic artifacts
        run: |
          python scripts/build_artifacts.py
          python scripts/build_artifacts.py --check
          cd artifacts
          sha256sum -c SHA256SUMS.txt
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/IndexTTS_DubFlow_Source_v0.2.0.zip
            artifacts/IndexTTS_DubFlow_Colab_R7.ipynb
            artifacts/IndexTTS_DubFlow_Colab_R7_Compact.ipynb
            artifacts/SHA256SUMS.txt
